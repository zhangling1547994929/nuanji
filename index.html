<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖记 - 艾宾浩斯私人英语单词记忆本</title>
  <style>
    /* ========== 全局变量 - 奶油浅杏暖色系 ========== */
    :root {
      --bg-primary: #FFF8F0;
      --bg-card: #FFFFFF;
      --bg-card-warm: #FFF5EB;
      --color-primary: #E8A87C;
      --color-primary-light: #F5C9A5;
      --color-primary-dark: #D4895C;
      --color-secondary: #C38D9E;
      --color-text: #5C4D3F;
      --color-text-light: #8B7D6B;
      --color-text-placeholder: #C4B5A0;
      --color-success: #7FC8A9;
      --color-danger: #E27D60;
      --color-warning: #F2CC8F;
      --shadow-soft: 0 4px 20px rgba(232, 168, 124, 0.15);
      --shadow-card: 0 2px 12px rgba(92, 77, 63, 0.08);
      --shadow-hover: 0 8px 30px rgba(232, 168, 124, 0.25);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --glow-warm: 0 0 20px rgba(232, 168, 124, 0.5), 0 0 40px rgba(232, 168, 124, 0.3);
    }

    /* ========== Reset ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--color-text);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== App Container ========== */
    #app {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-primary);
    }

    /* ========== Pages ========== */
    .page {
      display: none;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 100px;
    }

    .page.active {
      display: block;
    }

    /* ========== Header ========== */
    .page-header {
      text-align: center;
      padding: 12px 0 20px;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: 1px;
    }

    .page-header .subtitle {
      font-size: 13px;
      color: var(--color-text-light);
      margin-top: 4px;
    }

    /* ========== 进度条 ========== */
    .daily-progress {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .daily-progress .label {
      font-size: 14px;
      color: var(--color-text-light);
    }

    .daily-progress .count {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .daily-progress .count .total {
      font-size: 14px;
      color: var(--color-text-light);
      font-weight: 400;
    }

    .progress-bar-mini {
      flex: 1;
      height: 8px;
      background: var(--bg-card-warm);
      border-radius: 4px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-bar-mini .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-primary-light), var(--color-primary));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    /* ========== 录入表单 ========== */
    .input-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-light);
      margin-bottom: 8px;
    }

    .form-group label .required {
      color: var(--color-danger);
      margin-left: 2px;
    }

    .form-group label .auto-tag {
      display: inline-block;
      background: var(--color-primary-light);
      color: var(--color-primary-dark);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 2px solid #F0E6DA;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 15px;
      color: var(--color-text);
      background: var(--bg-card-warm);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(232, 168, 124, 0.1);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--color-text-placeholder);
    }

    .form-group textarea {
      resize: none;
      min-height: 60px;
    }

    .form-group .auto-filled {
      background: #F8FAF8;
      border-color: #D4E9D4;
      color: var(--color-text-light);
    }

    .lookup-status {
      font-size: 12px;
      color: var(--color-text-light);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lookup-status .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--color-primary-light);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== 按钮 ========== */
    .btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      box-shadow: 0 4px 14px rgba(232, 168, 124, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(232, 168, 124, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--color-success), #6BB896);
      color: #fff;
      box-shadow: 0 4px 14px rgba(127, 200, 169, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--color-danger), #D06850);
      color: #fff;
      box-shadow: 0 4px 14px rgba(226, 125, 96, 0.4);
    }

    .btn-outline {
      background: var(--bg-card);
      color: var(--color-text);
      border: 2px solid #F0E6DA;
    }

    .btn-block {
      width: 100%;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* ========== 底部导航 ========== */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(232, 168, 124, 0.12);
      display: flex;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      background: none;
      border: none;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--color-text-placeholder);
      transition: color 0.3s ease;
      font-family: inherit;
    }

    .nav-item.active {
      color: var(--color-primary);
    }

    .nav-item .nav-icon {
      font-size: 22px;
      line-height: 1;
    }

    .nav-item .nav-label {
      font-size: 11px;
      font-weight: 600;
    }

    /* ========== 背诵卡片 ========== */
    .review-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text);
      margin: 16px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-section-title .badge {
      background: var(--color-primary-light);
      color: var(--color-primary-dark);
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: 600;
    }

    .mode-switcher {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--bg-card-warm);
      border-radius: var(--radius-md);
      padding: 4px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: none;
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-light);
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .mode-btn.active {
      background: var(--bg-card);
      color: var(--color-primary);
      box-shadow: var(--shadow-card);
    }

    .word-card-container {
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .word-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 40px 24px;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: var(--shadow-soft);
      position: relative;
      transition: transform 0.5s ease, box-shadow 0.3s ease;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .word-card.playing {
      animation: glow-pulse 1.5s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(232, 168, 124, 0.4), 0 0 40px rgba(232, 168, 124, 0.2), var(--shadow-soft);
      }
      50% {
        box-shadow: 0 0 30px rgba(232, 168, 124, 0.6), 0 0 60px rgba(232, 168, 124, 0.35), var(--shadow-soft);
      }
    }

    .word-card.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateY(180deg);
      width: calc(100% - 48px);
    }

    .card-word {
      font-size: 36px;
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: 12px;
      cursor: pointer;
    }

    .card-phonetic {
      font-size: 18px;
      color: var(--color-primary);
      margin-bottom: 16px;
      font-style: italic;
    }

    .card-meaning {
      font-size: 16px;
      color: var(--color-text);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .card-example {
      font-size: 14px;
      color: var(--color-text-light);
      font-style: italic;
      line-height: 1.6;
      padding: 12px 16px;
      background: var(--bg-card-warm);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }

    .card-note {
      font-size: 13px;
      color: var(--color-secondary);
      padding: 8px 14px;
      background: rgba(195, 141, 158, 0.08);
      border-radius: var(--radius-sm);
    }

    .card-stage {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--bg-card-warm);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--color-text-light);
      font-weight: 600;
    }

    .card-tap-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--color-text-placeholder);
    }

    .review-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .review-actions .btn {
      flex: 1;
      padding: 16px;
      font-size: 16px;
    }

    .listen-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .listen-controls .btn-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .listen-controls .btn-icon:active {
      transform: scale(0.92);
    }

    .listen-controls .btn-icon.active {
      background: var(--color-primary);
      color: #fff;
    }

    /* ========== 空状态 ========== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-light);
    }

    .empty-state .empty-icon {
      font-size: 56px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state .empty-text {
      font-size: 15px;
      line-height: 1.8;
    }

    /* ========== 统计页面 ========== */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .stat-card .stat-number {
      font-size: 28px;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1.2;
    }

    .stat-card .stat-label {
      font-size: 11px;
      color: var(--color-text-light);
      margin-top: 4px;
    }

    .stat-card.review .stat-number { color: var(--color-secondary); }
    .stat-card.mastered .stat-number { color: var(--color-success); }

    .weekly-progress-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .weekly-progress-card .wp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .weekly-progress-card .wp-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
    }

    .weekly-progress-card .wp-count {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .weekly-progress-card .wp-count .wp-total {
      font-size: 12px;
      color: var(--color-text-light);
      font-weight: 400;
    }

    .progress-bar-large {
      height: 12px;
      background: var(--bg-card-warm);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-large .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-warning), var(--color-primary), var(--color-primary-dark));
      border-radius: 6px;
      transition: width 0.8s ease;
    }

    .word-list-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .word-list-card .wl-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 16px;
    }

    .word-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #F5EDE3;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .word-item:last-child {
      border-bottom: none;
    }

    .word-item:active {
      background: var(--bg-card-warm);
    }

    .word-item .wi-left {
      flex: 1;
      min-width: 0;
    }

    .word-item .wi-word {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text);
    }

    .word-item .wi-phonetic {
      font-size: 12px;
      color: var(--color-primary);
      font-style: italic;
    }

    .word-item .wi-meaning {
      font-size: 13px;
      color: var(--color-text-light);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .word-item .wi-stage {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 600;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .stage-0 { background: #F5EDE3; color: var(--color-text-light); }
    .stage-1 { background: #FFF0E0; color: var(--color-primary-dark); }
    .stage-2 { background: #FFE8D6; color: var(--color-primary-dark); }
    .stage-3 { background: #F5E0E8; color: var(--color-secondary); }
    .stage-4 { background: #E8F0E0; color: var(--color-success); }
    .stage-5 { background: #D4E9D4; color: #4A8A6A; }

    .word-item .wi-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--bg-card-warm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      margin-left: 8px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .word-item .wi-play:active {
      transform: scale(0.9);
      background: var(--color-primary-light);
    }

    /* ========== 详情弹窗 ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(92, 77, 63, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-content .mc-word {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .modal-content .mc-phonetic {
      text-align: center;
      font-size: 16px;
      color: var(--color-primary);
      font-style: italic;
      margin-bottom: 16px;
    }

    .modal-content .mc-section {
      margin-bottom: 16px;
    }

    .modal-content .mc-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-light);
      margin-bottom: 4px;
    }

    .modal-content .mc-section-content {
      font-size: 14px;
      color: var(--color-text);
      line-height: 1.6;
    }

    .modal-content .mc-play-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 16px 0;
    }

    .modal-content .mc-close {
      width: 100%;
      margin-top: 8px;
    }

    .modal-content .mc-edit {
      width: 100%;
      margin-top: 8px;
    }

    .modal-content textarea {
      width: 100%;
      border: 2px solid #F0E6DA;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      color: var(--color-text);
      background: var(--bg-card-warm);
      resize: none;
      min-height: 50px;
      font-family: inherit;
    }

    .modal-content textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .modal-content .mc-edit-input {
      width: 100%;
      border: 2px solid #F0E6DA;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      color: var(--color-text);
      background: #fff;
      font-family: inherit;
      margin-bottom: 8px;
    }

    .modal-content .mc-edit-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(232, 168, 124, 0.1);
    }

    .modal-content .mc-edit-word {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
    }

    .modal-content .mc-edit-phonetic {
      font-size: 15px;
      color: var(--color-primary);
      font-style: italic;
      text-align: center;
    }

    .modal-content .mc-section-display {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .modal-content .mc-section-display .mc-text {
      flex: 1;
      font-size: 14px;
      color: var(--color-text);
      line-height: 1.6;
      padding: 4px 0;
    }

    .modal-content .mc-inline-edit-btn {
      flex-shrink: 0;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid #E8D5C0;
      background: var(--bg-card-warm);
      color: var(--color-text-light);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .modal-content .mc-inline-edit-btn:active {
      background: var(--color-primary-light);
      color: var(--color-primary-dark);
    }

    /* ========== 提醒气泡 ========== */
    .reminder-bubble {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 14px 24px;
      box-shadow: var(--shadow-hover);
      z-index: 300;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 90%;
    }

    .reminder-bubble.show {
      transform: translateX(-50%) translateY(0);
    }

    .reminder-bubble .rb-icon {
      font-size: 20px;
    }

    .reminder-bubble .rb-text {
      font-size: 14px;
      color: var(--color-text);
      font-weight: 500;
    }

    /* ========== 鼓励弹窗 ========== */
    .encourage-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 248, 240, 0.95);
      backdrop-filter: blur(8px);
      z-index: 250;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .encourage-overlay.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    .encourage-content {
      text-align: center;
      max-width: 320px;
    }

    .encourage-content .ec-emoji {
      font-size: 64px;
      margin-bottom: 20px;
      animation: bounce 1s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .encourage-content .ec-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: 12px;
    }

    .encourage-content .ec-text {
      font-size: 15px;
      color: var(--color-text-light);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    /* ========== 工具栏 ========== */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .toolbar .btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
    }

    /* ========== 听音盲背 ========== */
    .listen-mode .word-card {
      background: linear-gradient(135deg, #FFF5EB, #FFE8D6);
    }

    .listen-mode .listen-info {
      text-align: center;
      color: var(--color-text-light);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .listen-mode .listen-visual {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 380px) {
      .card-word { font-size: 30px; }
      .stat-card .stat-number { font-size: 24px; }
    }

    /* Scrollbar */
    .page::-webkit-scrollbar { width: 0; }
    .modal-content::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="app">
    <!-- ========== 录入页面 ========== -->
    <div id="page-input" class="page active">
      <div class="page-header">
        <h1>暖记</h1>
        <div class="subtitle">每天3个词，温暖记一生</div>
      </div>

      <div class="daily-progress">
        <div>
          <div class="label">今日已录入</div>
        </div>
        <div class="progress-bar-mini">
          <div class="fill" id="daily-progress-fill" style="width: 0%"></div>
        </div>
        <div class="count"><span id="daily-count">0</span><span class="total">/3</span></div>
      </div>

      <div class="input-card">
        <div class="form-group">
          <label>英文单词 <span class="required">*</span></label>
          <input type="text" id="input-word" placeholder="输入英文单词，如 hello" autocomplete="off">
          <div class="lookup-status" id="lookup-status" style="display:none">
            <div class="spinner"></div>
            <span>正在联网查询音标和释义...</span>
          </div>
        </div>

        <div class="form-group">
          <label>美式音标 <span class="auto-tag">自动获取</span></label>
          <input type="text" id="input-phonetic" class="auto-filled" placeholder="联网自动填充" readonly>
        </div>

        <div class="form-group">
          <label>中文释义 <span class="auto-tag">自动获取</span></label>
          <input type="text" id="input-meaning" class="auto-filled" placeholder="联网自动填充，可修改">
        </div>

        <div class="form-group">
          <label>自用例句 <span class="required">*</span></label>
          <textarea id="input-example" placeholder="写一个你自己的例句，加深记忆"></textarea>
        </div>

        <div class="form-group">
          <label>记忆笔记（选填）</label>
          <textarea id="input-note" placeholder="记录你的记忆小技巧"></textarea>
        </div>

        <button class="btn btn-primary btn-block" id="btn-save-word">添加到单词本</button>
      </div>
    </div>

    <!-- ========== 背诵页面 ========== -->
    <div id="page-review" class="page">
      <div class="page-header">
        <h1>背诵</h1>
        <div class="subtitle">艾宾浩斯记忆法，温故知新</div>
      </div>

      <!-- 分区切换 -->
      <div class="mode-switcher">
        <button class="mode-btn active" data-section="review" onclick="switchReviewSection('review')">计划复习</button>
        <button class="mode-btn" data-section="new" onclick="switchReviewSection('new')">今日新词自测</button>
      </div>

      <!-- 模式切换 -->
      <div class="mode-switcher">
        <button class="mode-btn active" data-mode="en2cn" onclick="switchReviewMode('en2cn')">英译中</button>
        <button class="mode-btn" data-mode="cn2en" onclick="switchReviewMode('cn2en')">中译英</button>
        <button class="mode-btn" data-mode="listen" onclick="switchReviewMode('listen')">听音盲背</button>
      </div>

      <div id="review-content">
        <!-- 动态渲染 -->
      </div>
    </div>

    <!-- ========== 统计页面 ========== -->
    <div id="page-stats" class="page">
      <div class="page-header">
        <h1>统计</h1>

      </div>

      <div class="stats-cards">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">0</div>
          <div class="stat-label">总单词量</div>
        </div>
        <div class="stat-card review">
          <div class="stat-number" id="stat-review">0</div>
          <div class="stat-label">今日待复习</div>
        </div>
        <div class="stat-card mastered">
          <div class="stat-number" id="stat-mastered">0</div>
          <div class="stat-label">已熟记</div>
        </div>
      </div>

      <div class="weekly-progress-card">
        <div class="wp-header">
          <div class="wp-title">本周新词进度</div>
          <div class="wp-count"><span id="weekly-count">0</span><span class="wp-total">/21</span></div>
        </div>
        <div class="progress-bar-large">
          <div class="fill" id="weekly-progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn btn-outline" onclick="exportData()">导出数据</button>
        <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">导入数据</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      </div>

      <div class="word-list-card">
        <div class="wl-title">完整单词列表</div>
        <div id="word-list"></div>
      </div>

    <!-- ========== 底部导航 ========== -->
    <nav id="bottom-nav">
      <button class="nav-item active" data-page="input" onclick="switchPage('input')">
        <span class="nav-icon">✏️</span>
        <span class="nav-label">录入</span>
      </button>
      <button class="nav-item" data-page="review" onclick="switchPage('review')">
        <span class="nav-icon">📖</span>
        <span class="nav-label">背诵</span>
      </button>
      <button class="nav-item" data-page="stats" onclick="switchPage('stats')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">统计</span>
      </button>
    </nav>
  </div>

  <!-- ========== 详情弹窗 ========== -->
  <div class="modal-overlay" id="modal-detail">
    <div class="modal-content" id="modal-content">
      <!-- 动态填充 -->
    </div>
  </div>

  <!-- ========== 提醒气泡 ========== -->
  <div class="reminder-bubble" id="reminder-bubble">
    <span class="rb-icon" id="rb-icon">💡</span>
    <span class="rb-text" id="rb-text"></span>
  </div>

  <!-- ========== 鼓励弹窗 ========== -->
  <div class="encourage-overlay" id="encourage-overlay">
    <div class="encourage-content">
      <div class="ec-emoji" id="ec-emoji">🌱</div>
      <div class="ec-title" id="ec-title">新的一天，新的开始</div>
      <div class="ec-text" id="ec-text"></div>
      <button class="btn btn-primary" onclick="closeEncourage()">开始今天的学习</button>
    </div>
  </div>

  <script>
    /* ================================================================
       暖记 - 艾宾浩斯私人英语单词记忆本
       核心模块：数据管理 / 词典API / 语音朗读 / 艾宾浩斯逻辑 / UI渲染
    ================================================================ */

    // ========== 配置 ==========
    const CONFIG = {
      dailyTarget: 3,
      weeklyTarget: 21,
      storageKey: 'nuanji_data',
      ebbinghausIntervals: [1, 2, 4, 7, 15], // 天数间隔
    };

    // ========== 数据管理 ==========
    const DB = {
      data: {
        words: [],      // 单词总库
        plans: [],      // 艾宾浩斯复习计划
        settings: {
          lastOpenDate: null,
          lastEncourageDate: null,
        }
      },

      load() {
        try {
          const raw = localStorage.getItem(CONFIG.storageKey);
          if (raw) {
            this.data = JSON.parse(raw);
            if (!this.data.words) this.data.words = [];
            if (!this.data.plans) this.data.plans = [];
            if (!this.data.settings) this.data.settings = { lastOpenDate: null, lastEncourageDate: null };
          }
        } catch (e) {
          console.error('数据加载失败', e);
        }
      },

      save() {
        localStorage.setItem(CONFIG.storageKey, JSON.stringify(this.data));
      },

      // 添加单词
      addWord(word, example, phonetic, meaning, note) {
        const id = Date.now();
        const today = Utils.todayStr();
        const newWord = {
          id,
          word,
          phonetic: phonetic || '',
          meaning: meaning || '',
          example,
          note: note || '',
          createdDate: today,
        };
        this.data.words.push(newWord);

        // 自动生成复习计划：阶段0，次日开启
        const tomorrow = Utils.addDays(today, 1);
        this.data.plans.push({
          wordId: id,
          stage: 0,
          lastReviewDate: today,
          nextReviewDate: tomorrow,
          totalReviews: 0,
        });

        this.save();
        return newWord;
      },

      // 获取今日新词
      getTodayNewWords() {
        const today = Utils.todayStr();
        return this.data.words.filter(w => w.createdDate === today);
      },

      // 获取待复习单词
      getDueReviews() {
        const today = Utils.todayStr();
        return this.data.plans
          .filter(p => p.nextReviewDate <= today && p.stage < 5)
          .map(p => {
            const word = this.data.words.find(w => w.id === p.wordId);
            return word ? { ...word, plan: p } : null;
          })
          .filter(Boolean);
      },

      // 标记记得住
      markRemembered(wordId) {
        const plan = this.data.plans.find(p => p.wordId === wordId);
        if (!plan) return;
        plan.totalReviews++;
        if (plan.stage < 5) {
          plan.stage++;
          const interval = CONFIG.ebbinghausIntervals[plan.stage - 1] || 15;
          plan.nextReviewDate = Utils.addDays(Utils.todayStr(), interval);
        }
        if (plan.stage >= 5) {
          plan.nextReviewDate = null; // 永久停止
        }
        plan.lastReviewDate = Utils.todayStr();
        this.save();
      },

      // 标记忘记
      markForgotten(wordId) {
        const plan = this.data.plans.find(p => p.wordId === wordId);
        if (!plan) return;
        plan.totalReviews++;
        plan.nextReviewDate = Utils.addDays(Utils.todayStr(), 1);
        plan.lastReviewDate = Utils.todayStr();
        this.save();
      },

      // 自测记录（不影响正式复习计划）
      selfTestRecord(wordId, remembered) {
        // 自测不改动正式艾宾浩斯复习周期，仅记录
        this.save();
      },

      // 更新单词笔记
      updateNote(wordId, note) {
        const word = this.data.words.find(w => w.id === wordId);
        if (word) {
          word.note = note;
          this.save();
        }
      },

      // 更新单词内容（编辑单词、例句、音标、释义）
      updateWord(wordId, updates) {
        const word = this.data.words.find(w => w.id === wordId);
        if (!word) return;
        if (updates.word !== undefined) word.word = updates.word;
        if (updates.phonetic !== undefined) word.phonetic = updates.phonetic;
        if (updates.meaning !== undefined) word.meaning = updates.meaning;
        if (updates.example !== undefined) word.example = updates.example;
        if (updates.note !== undefined) word.note = updates.note;
        this.save();
      },

      // 获取统计
      getStats() {
        const total = this.data.words.length;
        const mastered = this.data.plans.filter(p => p.stage >= 5).length;
        const dueReviews = this.getDueReviews().length;
        const todayNew = this.getTodayNewWords().length;

        // 本周新词
        const weekStart = Utils.getWeekStart();
        const weeklyNew = this.data.words.filter(w => w.createdDate >= weekStart).length;

        return { total, mastered, dueReviews, todayNew, weeklyNew };
      },

      // 导出
      exportAll() {
        return JSON.stringify(this.data, null, 2);
      },

      // 导入
      importAll(jsonStr) {
        const data = JSON.parse(jsonStr);
        if (data.words && data.plans) {
          this.data = data;
          this.save();
          return true;
        }
        return false;
      }
    };

    // ========== 工具函数 ==========
    const Utils = {
      todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      },

      addDays(dateStr, days) {
        const d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + days);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      },

      daysBetween(dateStr1, dateStr2) {
        const d1 = new Date(dateStr1 + 'T00:00:00');
        const d2 = new Date(dateStr2 + 'T00:00:00');
        return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
      },

      getWeekStart() {
        const d = new Date();
        const day = d.getDay() || 7; // 周日=7
        d.setDate(d.getDate() - day + 1);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      },

      escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    };

    // ========== 词典API ==========
    const DictionaryAPI = {
      async lookup(word) {
        const result = { phonetic: '', meaning: '', audioUrl: '' };

        // 1. Free Dictionary API 获取音标和英文释义
        try {
          const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`);
          if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data) && data.length > 0) {
              const entry = data[0];

              // 音标
              if (entry.phonetics && entry.phonetics.length > 0) {
                const withText = entry.phonetics.find(p => p.text);
                if (withText) result.phonetic = withText.text;
                const withAudio = entry.phonetics.find(p => p.audio && p.audio.length > 0);
                if (withAudio) result.audioUrl = withAudio.audio;
              }

              // 英文释义
              if (entry.meanings && entry.meanings.length > 0) {
                const meaning = entry.meanings[0];
                if (meaning.definitions && meaning.definitions.length > 0) {
                  result.meaning = meaning.definitions[0].definition;
                }
              }
            }
          }
        } catch (e) {
          console.warn('Dictionary API failed', e);
        }

        // 2. 获取中文翻译
        try {
          const transResp = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`);
          if (transResp.ok) {
            const transData = await transResp.json();
            if (transData.responseData && transData.responseData.translatedText) {
              let cnText = transData.responseData.translatedText;
              // 如果有英文释义，也翻译释义
              if (result.meaning) {
                try {
                  const defResp = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(result.meaning)}&langpair=en|zh-CN`);
                  if (defResp.ok) {
                    const defData = await defResp.json();
                    if (defData.responseData && defData.responseData.translatedText) {
                      cnText += '；' + defData.responseData.translatedText;
                    }
                  }
                } catch (e) {}
              }
              result.meaning = cnText;
            }
          }
        } catch (e) {
          console.warn('Translation API failed', e);
          // 如果翻译失败但有英文释义，保留英文释义
          if (!result.meaning) result.meaning = '(联网获取失败，请手动填写)';
        }

        return result;
      }
    };

    // ========== 语音朗读 ==========
    const Speech = {
      synth: window.speechSynthesis,
      voices: [],
      currentUtterance: null,
      onStateChange: null,
      isPlaying: false,

      init() {
        const loadVoices = () => {
          this.voices = this.synth.getVoices();
        };
        loadVoices();
        this.synth.onvoiceschanged = loadVoices;
      },

      getUSVoice() {
        if (!this.voices.length) this.voices = this.synth.getVoices();
        // 优先找美式英语女声
        return this.voices.find(v => v.lang === 'en-US' && /female|samantha|zira|jenny|aria/i.test(v.name))
            || this.voices.find(v => v.lang === 'en-US')
            || this.voices.find(v => v.lang.startsWith('en'))
            || null;
      },

      speak(text, opts = {}) {
        this.stop();
        if (!text) return;

        const utterance = new SpeechSynthesisUtterance(text);
        const voice = this.getUSVoice();
        if (voice) {
          utterance.voice = voice;
          utterance.lang = 'en-US';
        }
        utterance.rate = opts.rate || 0.9;
        utterance.pitch = opts.pitch || 1;

        utterance.onstart = () => {
          this.isPlaying = true;
          if (this.onStateChange) this.onStateChange(true);
        };

        utterance.onend = () => {
          this.isPlaying = false;
          if (this.onStateChange) this.onStateChange(false);
          if (opts.onEnd) opts.onEnd();
        };

        utterance.onerror = () => {
          this.isPlaying = false;
          if (this.onStateChange) this.onStateChange(false);
        };

        this.currentUtterance = utterance;
        this.synth.speak(utterance);
      },

      speakWord(word) {
        this.speak(word, { rate: 0.85 });
      },

      speakSentence(sentence) {
        this.speak(sentence, { rate: 0.8 });
      },

      speakWordAndSentence(word, sentence, onComplete) {
        this.speakWord(word);
        // 串行播放：单词结束后播例句
        const originalOnEnd = this.currentUtterance.onend;
        this.currentUtterance.onend = () => {
          this.isPlaying = false;
          if (this.onStateChange) this.onStateChange(false);
          if (sentence) {
            setTimeout(() => {
              this.speakSentence(sentence);
              if (this.currentUtterance) {
                this.currentUtterance.onend = () => {
                  this.isPlaying = false;
                  if (this.onStateChange) this.onStateChange(false);
                  if (onComplete) onComplete();
                };
              }
            }, 300);
          } else {
            if (onComplete) onComplete();
          }
        };
      },

      stop() {
        if (this.synth) {
          this.synth.cancel();
        }
        this.isPlaying = false;
        if (this.onStateChange) this.onStateChange(false);
      }
    };

    // ========== 艾宾浩斯逻辑 ==========
    const Ebbinghaus = {
      getStageText(stage) {
        const texts = ['新词', '阶段1', '阶段2', '阶段3', '阶段4', '已熟记'];
        return texts[stage] || '未知';
      },

      getNextInterval(stage) {
        if (stage >= 5) return null;
        return CONFIG.ebbinghausIntervals[stage] || 15;
      },

      getStageColor(stage) {
        return `stage-${stage}`;
      }
    };

    // ========== UI 渲染 ==========
    const UI = {
      currentReviewSection: 'review', // 'review' or 'new'
      currentReviewMode: 'en2cn',     // 'en2cn', 'cn2en', 'listen'
      reviewQueue: [],
      reviewIndex: 0,
      isCardFlipped: false,
      listenLoopActive: false,

      // 页面切换
      switchPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(`page-${pageName}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector(`.nav-item[data-page="${pageName}"]`).classList.add('active');

        if (pageName === 'review') {
          this.refreshReviewPage();
        } else if (pageName === 'stats') {
          this.refreshStatsPage();
        } else if (pageName === 'input') {
          this.refreshInputPage();
        }

        // 切页时停止语音
        Speech.stop();
      },

      // 刷新录入页面
      refreshInputPage() {
        const todayNew = DB.getTodayNewWords().length;
        document.getElementById('daily-count').textContent = todayNew;
        const pct = Math.min(100, (todayNew / CONFIG.dailyTarget) * 100);
        document.getElementById('daily-progress-fill').style.width = pct + '%';
      },

      // 查词
      async lookupWord() {
        const word = document.getElementById('input-word').value.trim();
        if (!word) {
          document.getElementById('lookup-status').style.display = 'none';
          document.getElementById('input-phonetic').value = '';
          document.getElementById('input-meaning').value = '';
          return;
        }

        // 仅在输入超过2个字符时查询
        if (word.length < 2) return;

        document.getElementById('lookup-status').style.display = 'flex';
        const result = await DictionaryAPI.lookup(word);
        document.getElementById('lookup-status').style.display = 'none';

        if (result.phonetic) {
          document.getElementById('input-phonetic').value = result.phonetic;
        }
        if (result.meaning) {
          document.getElementById('input-meaning').value = result.meaning;
        }
      },

      // 保存单词
      saveWord() {
        const word = document.getElementById('input-word').value.trim();
        const example = document.getElementById('input-example').value.trim();
        const phonetic = document.getElementById('input-phonetic').value.trim();
        const meaning = document.getElementById('input-meaning').value.trim();
        const note = document.getElementById('input-note').value.trim();

        if (!word) {
          this.showReminder('请输入英文单词', '📝');
          return;
        }
        if (!example) {
          this.showReminder('写一个自用例句，记忆更深哦', '✨');
          return;
        }

        DB.addWord(word, example, phonetic, meaning, note);

        // 清空表单
        document.getElementById('input-word').value = '';
        document.getElementById('input-example').value = '';
        document.getElementById('input-note').value = '';
        document.getElementById('input-phonetic').value = '';
        document.getElementById('input-meaning').value = '';

        this.refreshInputPage();

        const todayCount = DB.getTodayNewWords().length;
        if (todayCount >= CONFIG.dailyTarget) {
          this.showReminder('今日目标完成！真棒 🎉', '🌟');
        } else {
          this.showReminder(`已录入！今日 ${todayCount}/${CONFIG.dailyTarget}，继续加油`, '💕');
        }
      },

      // 刷新背诵页面
      refreshReviewPage() {
        if (this.currentReviewSection === 'review') {
          this.reviewQueue = DB.getDueReviews();
        } else {
          this.reviewQueue = DB.getTodayNewWords();
        }
        this.reviewIndex = 0;
        this.isCardFlipped = false;
        this.listenLoopActive = false;
        this.renderReviewCard();
      },

      // 渲染当前卡片
      renderReviewCard() {
        const container = document.getElementById('review-content');
        Speech.stop();

        if (this.reviewQueue.length === 0) {
          const msg = this.currentReviewSection === 'review'
            ? '今日没有待复习的单词<br>去录入新词吧 ✏️'
            : '今天还没有录入新词<br>先去录入几个吧 💫';
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">${this.currentReviewSection === 'review' ? '🎯' : '🌱'}</div>
              <div class="empty-text">${msg}</div>
            </div>
          `;
          return;
        }

        const item = this.reviewQueue[this.reviewIndex];
        const mode = this.currentReviewMode;
        const stageText = item.plan ? Ebbinghaus.getStageText(item.plan.stage) : '自测';
        const stageClass = item.plan ? Ebbinghaus.getStageColor(item.plan.stage) : 'stage-0';

        let cardHTML = '';

        if (mode === 'en2cn') {
          cardHTML = `
            <div class="word-card-container">
              <div class="word-card" id="word-card" onclick="UI.flipCard()">
                <div class="card-stage ${stageClass}">${stageText}</div>
                <div class="card-front">
                  <div class="card-word" onclick="event.stopPropagation(); Speech.speakWord('${Utils.escapeHtml(item.word)}')">${Utils.escapeHtml(item.word)}</div>
                  <div style="font-size:13px;color:var(--color-text-light);margin-bottom:8px;">点击单词听发音</div>
                  <div class="card-tap-hint">点击卡片翻转查看释义</div>
                </div>
                <div class="card-back">
                  <div class="card-phonetic">${Utils.escapeHtml(item.phonetic) || '—'}</div>
                  <div class="card-meaning">${Utils.escapeHtml(item.meaning) || '—'}</div>
                  ${item.example ? `<div class="card-example" onclick="event.stopPropagation(); Speech.speakSentence('${Utils.escapeHtml(item.example)}')">"${Utils.escapeHtml(item.example)}"</div>` : ''}
                  ${item.note ? `<div class="card-note">📝 ${Utils.escapeHtml(item.note)}</div>` : ''}
                  <div class="card-tap-hint">点击卡片翻回</div>
                </div>
              </div>
            </div>
            <div class="review-actions">
              <button class="btn btn-danger" onclick="UI.markForgotten()">❌ 忘记</button>
              <button class="btn btn-success" onclick="UI.markRemembered()">✅ 记得住</button>
            </div>
            <div style="text-align:center;font-size:12px;color:var(--color-text-light);">
              ${this.reviewIndex + 1} / ${this.reviewQueue.length}
            </div>
          `;
        } else if (mode === 'cn2en') {
          cardHTML = `
            <div class="word-card-container">
              <div class="word-card" id="word-card" onclick="UI.flipCard()">
                <div class="card-stage ${stageClass}">${stageText}</div>
                <div class="card-front">
                  <div class="card-meaning" style="font-size:22px;font-weight:700;">${Utils.escapeHtml(item.meaning) || '—'}</div>
                  <div style="margin-top:12px;font-size:13px;color:var(--color-text-light);">想想对应的英文单词</div>
                  <div class="card-tap-hint">点击卡片翻转查看答案</div>
                </div>
                <div class="card-back">
                  <div class="card-word" onclick="event.stopPropagation(); Speech.speakWord('${Utils.escapeHtml(item.word)}')">${Utils.escapeHtml(item.word)}</div>
                  <div class="card-phonetic">${Utils.escapeHtml(item.phonetic) || '—'}</div>
                  ${item.example ? `<div class="card-example" onclick="event.stopPropagation(); Speech.speakSentence('${Utils.escapeHtml(item.example)}')">"${Utils.escapeHtml(item.example)}"</div>` : ''}
                  ${item.note ? `<div class="card-note">📝 ${Utils.escapeHtml(item.note)}</div>` : ''}
                  <div class="card-tap-hint">点击卡片翻回</div>
                </div>
              </div>
            </div>
            <div class="review-actions">
              <button class="btn btn-danger" onclick="UI.markForgotten()">❌ 忘记</button>
              <button class="btn btn-success" onclick="UI.markRemembered()">✅ 记得住</button>
            </div>
            <div style="text-align:center;font-size:12px;color:var(--color-text-light);">
              ${this.reviewIndex + 1} / ${this.reviewQueue.length}
            </div>
          `;
        } else if (mode === 'listen') {
          cardHTML = `
            <div class="listen-mode">
              <div class="listen-info">闭眼聆听，靠耳朵背单词</div>
              <div class="word-card-container">
                <div class="word-card" id="word-card" style="min-height:200px;">
                  <div class="listen-visual" id="listen-visual">🔊</div>
                  <div style="font-size:13px;color:var(--color-text-light);" id="listen-status">点击下方按钮播放</div>
                </div>
              </div>
              <div class="listen-controls">
                <button class="btn-icon" onclick="UI.playWordOnly()" title="单词发音">🔤</button>
                <button class="btn-icon" onclick="UI.playSentenceOnly()" title="例句朗读">📜</button>
                <button class="btn-icon ${this.listenLoopActive ? 'active' : ''}" id="btn-loop" onclick="UI.toggleListenLoop()" title="循环播放">🔄</button>
                <button class="btn-icon" onclick="UI.stopListen()" title="停止">⏹️</button>
              </div>
              <div class="review-actions">
                <button class="btn btn-danger" onclick="UI.markForgotten()">❌ 忘记</button>
                <button class="btn btn-success" onclick="UI.markRemembered()">✅ 记得住</button>
              </div>
              <div style="text-align:center;font-size:12px;color:var(--color-text-light);">
                ${this.reviewIndex + 1} / ${this.reviewQueue.length}
              </div>
            </div>
          `;
        }

        container.innerHTML = cardHTML;

        // 设置语音状态回调
        Speech.onStateChange = (playing) => {
          const card = document.getElementById('word-card');
          if (card) {
            if (playing) card.classList.add('playing');
            else card.classList.remove('playing');
          }
        };

        // 英译中模式自动播放单词
        if (mode === 'en2cn') {
          setTimeout(() => Speech.speakWord(item.word), 300);
        }

        // 听音模式自动播放
        if (mode === 'listen') {
          setTimeout(() => this.playWordAndSentence(), 500);
        }
      },

      // 翻转卡片
      flipCard() {
        if (this.currentReviewMode === 'listen') return;
        const card = document.getElementById('word-card');
        if (!card) return;
        this.isCardFlipped = !this.isCardFlipped;
        card.classList.toggle('flipped');

        // 翻转到背面时播放例句
        if (this.isCardFlipped) {
          const item = this.reviewQueue[this.reviewIndex];
          if (item && item.example) {
            setTimeout(() => Speech.speakSentence(item.example), 300);
          }
        }
      },

      // 标记记得住
      markRemembered() {
        const item = this.reviewQueue[this.reviewIndex];
        if (!item) return;
        Speech.stop();

        if (this.currentReviewSection === 'review' && item.plan) {
          DB.markRemembered(item.id);
        } else {
          DB.selfTestRecord(item.id, true);
        }

        this.nextCard();
      },

      // 标记忘记
      markForgotten() {
        const item = this.reviewQueue[this.reviewIndex];
        if (!item) return;
        Speech.stop();

        if (this.currentReviewSection === 'review' && item.plan) {
          DB.markForgotten(item.id);
        } else {
          DB.selfTestRecord(item.id, false);
        }

        // 忘记时自动朗读例句
        if (item.example) {
          setTimeout(() => Speech.speakSentence(item.example), 200);
          // 朗读完再切下一张
          Speech.onStateChange = (playing) => {
            const card = document.getElementById('word-card');
            if (card) {
              if (playing) card.classList.add('playing');
              else card.classList.remove('playing');
            }
          };
          setTimeout(() => this.nextCard(), 3000);
        } else {
          this.nextCard();
        }
      },

      // 下一张
      nextCard() {
        Speech.stop();
        this.reviewIndex++;
        this.isCardFlipped = false;
        this.listenLoopActive = false;

        if (this.reviewIndex >= this.reviewQueue.length) {
          // 完成本轮
          const container = document.getElementById('review-content');
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🎉</div>
              <div class="empty-text">本轮复习完成！<br>休息一下，明天继续 💛</div>
            </div>
          `;
        } else {
          this.renderReviewCard();
        }
      },

      // 听音模式：播放单词
      playWordOnly() {
        const item = this.reviewQueue[this.reviewIndex];
        if (item) Speech.speakWord(item.word);
      },

      // 听音模式：播放例句
      playSentenceOnly() {
        const item = this.reviewQueue[this.reviewIndex];
        if (item && item.example) Speech.speakSentence(item.example);
      },

      // 听音模式：播放单词+例句
      playWordAndSentence() {
        const item = this.reviewQueue[this.reviewIndex];
        if (!item) return;
        Speech.speakWordAndSentence(item.word, item.example);
      },

      // 听音模式：循环播放
      toggleListenLoop() {
        this.listenLoopActive = !this.listenLoopActive;
        const btn = document.getElementById('btn-loop');
        if (btn) btn.classList.toggle('active', this.listenLoopActive);

        if (this.listenLoopActive) {
          this.runListenLoop();
        } else {
          Speech.stop();
        }
      },

      runListenLoop() {
        if (!this.listenLoopActive) return;
        const item = this.reviewQueue[this.reviewIndex];
        if (!item) return;

        const status = document.getElementById('listen-status');
        if (status) status.textContent = '循环播放中...';

        Speech.speakWordAndSentence(item.word, item.example, () => {
          if (this.listenLoopActive) {
            setTimeout(() => this.runListenLoop(), 1000);
          }
        });
      },

      stopListen() {
        this.listenLoopActive = false;
        const btn = document.getElementById('btn-loop');
        if (btn) btn.classList.remove('active');
        const status = document.getElementById('listen-status');
        if (status) status.textContent = '已停止';
        Speech.stop();
      },

      // 切换复习分区
      switchReviewSection(section) {
        this.currentReviewSection = section;
        document.querySelectorAll('.mode-btn[data-section]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.section === section);
        });
        this.refreshReviewPage();
      },

      // 切换复习模式
      switchReviewMode(mode) {
        this.currentReviewMode = mode;
        this.isCardFlipped = false;
        this.listenLoopActive = false;
        document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        this.renderReviewCard();
      },

      // 刷新统计页面
      refreshStatsPage() {
        const stats = DB.getStats();
        document.getElementById('stat-total').textContent = stats.total;
        document.getElementById('stat-review').textContent = stats.dueReviews;
        document.getElementById('stat-mastered').textContent = stats.mastered;
        document.getElementById('weekly-count').textContent = stats.weeklyNew;
        const weeklyPct = Math.min(100, (stats.weeklyNew / CONFIG.weeklyTarget) * 100);
        document.getElementById('weekly-progress-fill').style.width = weeklyPct + '%';

        // 单词列表
        const listEl = document.getElementById('word-list');
        if (DB.data.words.length === 0) {
          listEl.innerHTML = '<div style="text-align:center;padding:30px 0;color:var(--color-text-light);font-size:14px;">还没有单词，去录入吧 ✏️</div>';
          return;
        }

        const sortedWords = [...DB.data.words].reverse();
        listEl.innerHTML = sortedWords.map(w => {
          const plan = DB.data.plans.find(p => p.wordId === w.id);
          const stage = plan ? plan.stage : 0;
          const stageText = Ebbinghaus.getStageText(stage);
          const stageClass = Ebbinghaus.getStageColor(stage);
          return `
            <div class="word-item" onclick="UI.showDetail(${w.id})">
              <div class="wi-left">
                <div class="wi-word">${Utils.escapeHtml(w.word)}</div>
                ${w.phonetic ? `<div class="wi-phonetic">${Utils.escapeHtml(w.phonetic)}</div>` : ''}
                <div class="wi-meaning">${Utils.escapeHtml(w.meaning) || '—'}</div>
              </div>
              <div class="wi-stage ${stageClass}">${stageText}</div>
              <button class="wi-play" onclick="event.stopPropagation(); Speech.speakWord('${Utils.escapeHtml(w.word)}')">🔊</button>
            </div>
          `;
        }).join('');
      },

      // 显示详情
      showDetail(wordId) {
        const word = DB.data.words.find(w => w.id === wordId);
        if (!word) return;
        const plan = DB.data.plans.find(p => p.wordId === wordId);
        const stage = plan ? plan.stage : 0;

        const modal = document.getElementById('modal-detail');
        const content = document.getElementById('modal-content');
        // 在modal上记录当前查看的wordId
        modal.dataset.wordId = wordId;

        content.innerHTML = `
          <div class="mc-word" id="detail-word">${Utils.escapeHtml(word.word)}</div>
          <div class="mc-phonetic" id="detail-phonetic">${Utils.escapeHtml(word.phonetic) || '—'}</div>

          <div class="mc-play-row" id="detail-play-row">
            <button class="btn-icon" style="width:44px;height:44px;border-radius:50%;border:none;background:var(--bg-card-warm);font-size:18px;cursor:pointer;" onclick="Speech.speakWord('${Utils.escapeHtml(word.word)}')">🔤</button>
            ${word.example ? `<button class="btn-icon" style="width:44px;height:44px;border-radius:50%;border:none;background:var(--bg-card-warm);font-size:18px;cursor:pointer;" onclick="Speech.speakSentence('${Utils.escapeHtml(word.example)}')">📜</button>` : ''}
          </div>

          <div class="mc-section">
            <div class="mc-section-title">中文释义</div>
            <div class="mc-section-display">
              <div class="mc-text" id="detail-meaning">${Utils.escapeHtml(word.meaning) || '—'}</div>
              <button class="mc-inline-edit-btn" onclick="UI.startInlineEdit(${wordId}, 'meaning')">✏️ 修改</button>
            </div>
          </div>

          <div class="mc-section">
            <div class="mc-section-title">自用例句</div>
            <div class="mc-section-display">
              <div class="mc-text" id="detail-example">${Utils.escapeHtml(word.example) || '—'}</div>
              <button class="mc-inline-edit-btn" onclick="UI.startInlineEdit(${wordId}, 'example')">✏️ 修改</button>
            </div>
          </div>

          <div class="mc-section">
            <div class="mc-section-title">记忆笔记</div>
            <div class="mc-section-display">
              <div class="mc-text" id="detail-note">${Utils.escapeHtml(word.note || '') || '（暂无笔记）'}</div>
              <button class="mc-inline-edit-btn" onclick="UI.startInlineEdit(${wordId}, 'note')">✏️ 修改</button>

          </div>

          <div class="mc-section">
            <div class="mc-section-title">复习信息</div>
            <div class="mc-section-content">
              记忆阶段：${Ebbinghaus.getStageText(stage)}<br>
              背诵次数：${plan ? plan.totalReviews : 0} 次<br>
              录入日期：${word.createdDate}
            </div>
          </div>

          <button class="btn btn-primary btn-block mc-edit" onclick="UI.startFullEdit(${wordId})" style="margin-top:16px;">编辑单词 / 例句</button>
          <button class="btn btn-outline btn-block mc-close" onclick="UI.closeDetail()">关闭</button>
        `;

        modal.classList.add('show');
      },

      // 全局编辑模式（编辑单词本身、音标、例句）
      startFullEdit(wordId) {
        const word = DB.data.words.find(w => w.id === wordId);
        if (!word) return;

        const content = document.getElementById('modal-content');
        const plan = DB.data.plans.find(p => p.wordId === wordId);
        const stage = plan ? plan.stage : 0;

        content.innerHTML = `
          <div style="text-align:center;font-size:13px;color:var(--color-primary);margin-bottom:12px;font-weight:600;">✏️ 编辑单词</div>

          <div class="mc-section">
            <div class="mc-section-title">英文单词</div>
            <input type="text" class="mc-edit-input mc-edit-word" id="edit-word" value="${Utils.escapeHtml(word.word)}">
          </div>

          <div class="mc-section">
            <div class="mc-section-title">美式音标</div>
            <input type="text" class="mc-edit-input mc-edit-phonetic" id="edit-phonetic" value="${Utils.escapeHtml(word.phonetic) || ''}" placeholder="可手动修改">
          </div>

          <div class="mc-section">
            <div class="mc-section-title">中文释义</div>
            <textarea class="mc-edit-input" id="edit-meaning" rows="2">${Utils.escapeHtml(word.meaning) || ''}</textarea>
          </div>

          <div class="mc-section">
            <div class="mc-section-title">自用例句</div>
            <textarea class="mc-edit-input" id="edit-example" rows="2">${Utils.escapeHtml(word.example) || ''}</textarea>
          </div>

          <div class="mc-section">
            <div class="mc-section-title">记忆笔记</div>
            <textarea class="mc-edit-input" id="edit-note" rows="2">${Utils.escapeHtml(word.note || '')}</textarea>
          </div>

          <div class="mc-section">
            <div class="mc-section-title">复习信息</div>
            <div class="mc-section-content">
              记忆阶段：${Ebbinghaus.getStageText(stage)}<br>
              背诵次数：${plan ? plan.totalReviews : 0} 次<br>
              录入日期：${word.createdDate}
            </div>
          </div>

          <div style="display:flex;gap:10px;margin-top:16px;">
            <button class="btn btn-outline" onclick="UI.showDetail(${wordId})" style="flex:1;">取消</button>
            <button class="btn btn-primary" onclick="UI.saveFullEdit(${wordId})" style="flex:1;">保存修改</button>
          </div>
        `;
      },

      // 保存全局编辑
      saveFullEdit(wordId) {
        const newWord = document.getElementById('edit-word').value.trim();
        const newPhonetic = document.getElementById('edit-phonetic').value.trim();
        const newMeaning = document.getElementById('edit-meaning').value.trim();
        const newExample = document.getElementById('edit-example').value.trim();
        const newNote = document.getElementById('edit-note').value.trim();

        if (!newWord) {
          this.showReminder('单词不能为空', '⚠️');
          return;
        }
        if (!newExample) {
          this.showReminder('例句不能为空哦', '⚠️');
          return;
        }

        DB.updateWord(wordId, {
          word: newWord,
          phonetic: newPhonetic,
          meaning: newMeaning,
          example: newExample,
          note: newNote,
        });

        this.showReminder('单词修改已保存', '✅');

        // 更新审核栏的播放按钮引用
        document.getElementById('modal-detail').dataset.wordId = wordId;

        // 刷新显示
        this.showDetail(wordId);
      },

      // 单字段内联编辑
      startInlineEdit(wordId, field) {
        const word = DB.data.words.find(w => w.id === wordId);
        if (!word) return;

        const fieldLabels = {
          meaning: '中文释义',
          example: '自用例句',
          note: '记忆笔记',
        };
        const label = fieldLabels[field] || field;

        const currentValue = word[field] || '';

        const displayEl = document.getElementById(`detail-${field}`);
        if (!displayEl) return;

        const parentSection = displayEl.closest('.mc-section-display');
        if (!parentSection) return;

        parentSection.innerHTML = `
          <textarea class="mc-edit-input" id="inline-edit-${field}" rows="2">${Utils.escapeHtml(currentValue)}</textarea>
          <div style="display:flex;gap:6px;margin-top:6px;">
            <button class="mc-inline-edit-btn" onclick="UI.cancelInlineEdit(${wordId}, '${field}')">取消</button>
            <button class="mc-inline-edit-btn" style="background:var(--color-primary-light);color:var(--color-primary-dark);font-weight:600;" onclick="UI.saveInlineEdit(${wordId}, '${field}')">保存</button>
          </div>
        `;

        // 自动聚焦
        setTimeout(() => {
          const input = document.getElementById(`inline-edit-${field}`);
          if (input) input.focus();
        }, 100);
      },

      // 取消内联编辑
      cancelInlineEdit(wordId, field) {
        this.showDetail(wordId);
      },

      // 保存内联编辑
      saveInlineEdit(wordId, field) {
        const input = document.getElementById(`inline-edit-${field}`);
        if (!input) return;

        const value = input.value.trim();
        const update = {};
        update[field] = value;
        DB.updateWord(wordId, update);

        this.showReminder('已保存', '✅');
        this.showDetail(wordId);
      },

      closeDetail() {
        document.getElementById('modal-detail').classList.remove('show');
      },

      // 提醒气泡
      showReminder(text, icon = '💡') {
        const bubble = document.getElementById('reminder-bubble');
        document.getElementById('rb-text').textContent = text;
        document.getElementById('rb-icon').textContent = icon;
        bubble.classList.add('show');
        setTimeout(() => bubble.classList.remove('show'), 3000);
      },

      // 鼓励弹窗
      showEncourage(text, emoji = '🌱', title = '新的一天，新的开始') {
        document.getElementById('ec-text').textContent = text;
        document.getElementById('ec-emoji').textContent = emoji;
        document.getElementById('ec-title').textContent = title;
        document.getElementById('encourage-overlay').classList.add('show');
      },
    };

    // ========== 全局函数 ==========
    function switchPage(page) { UI.switchPage(page); }
    function switchReviewSection(section) { UI.switchReviewSection(section); }
    function switchReviewMode(mode) { UI.switchReviewMode(mode); }
    function exportData() {
      const data = DB.exportAll();
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `暖记单词库_${Utils.todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      UI.showReminder('数据已导出到下载文件夹', '📁');
    }
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          if (DB.importAll(e.target.result)) {
            UI.refreshStatsPage();
            UI.refreshInputPage();
            UI.showReminder('数据导入成功！', '✅');
          } else {
            UI.showReminder('文件格式不正确', '❌');
          }
        } catch (err) {
          UI.showReminder('导入失败：' + err.message, '❌');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
    function closeEncourage() {
      document.getElementById('encourage-overlay').classList.remove('show');
    }

    // ========== 初始化 ==========
    function init() {
      DB.load();
      Speech.init();
      UI.refreshInputPage();

      // 输入框防抖查词
      let lookupTimer = null;
      document.getElementById('input-word').addEventListener('input', () => {
        clearTimeout(lookupTimer);
        lookupTimer = setTimeout(() => UI.lookupWord(), 800);
      });

      // 保存按钮
      document.getElementById('btn-save-word').addEventListener('click', () => UI.saveWord());

      // 回车保存
      document.getElementById('input-example').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          UI.saveWord();
        }
      });

      // 检查每日任务 & 鼓励弹窗
      const today = Utils.todayStr();
      const yesterday = Utils.addDays(today, -1);
      const settings = DB.data.settings;

      if (settings.lastOpenDate !== today) {
        // 检查昨天是否完成
        if (settings.lastOpenDate === yesterday) {
          const yesterdayNew = DB.data.words.filter(w => w.createdDate === yesterday).length;
          if (yesterdayNew < CONFIG.dailyTarget) {
            const msgs = [
              '昨天差一点点就完成啦，今天继续加油！',
              '没关系，学习是长跑不是短跑，今天重新开始 💪',
              '昨天的词今天可以补记，每天进步一点点就好',
            ];
            UI.showEncourage(msgs[Math.floor(Math.random() * msgs.length)], '🌱', '新的一天，新的开始');
          } else {
            UI.showEncourage('昨天完美完成目标！今天也要保持哦 🌟', '🎉', '继续保持！');
          }
        } else if (settings.lastOpenDate && Utils.daysBetween(settings.lastOpenDate, today) > 1) {
          UI.showEncourage('好久不见！欢迎回来，今天从3个新词开始吧', '🌻', '欢迎回来');
        }
        settings.lastOpenDate = today;
        DB.save();
      }

      // 点击弹窗外关闭
      document.getElementById('modal-detail').addEventListener('click', (e) => {
        if (e.target.id === 'modal-detail') UI.closeDetail();
      });

      console.log('暖记 已启动 ☀️');
    }

    // 启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
